<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Preview - LinkUnzip</title>
    <link rel="icon" href="icons/icon32.png" />
    <script src="theme.js"></script>
    <link rel="stylesheet" href="vendor/geist/geist.css" />
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <img class="mark" src="icons/logo-lines.png" alt="" width="14" height="24" />
        <span class="wordmark" aria-label="LinkUnzip"><b>LINK</b>UNZIP</span>
      </div>
      <div class="title">
        <h1 id="name" data-i18n>Preview</h1>
        <p id="where" class="muted"></p>
      </div>
      <nav class="nav" aria-label="Files in this folder" data-i18n-aria-label>
        <button id="prev" class="btn" type="button" title="Previous file (Left arrow)" data-i18n-title disabled><span data-i18n>Previous</span></button>
        <button id="next" class="btn" type="button" title="Next file (Right arrow)" data-i18n-title disabled><span data-i18n>Next</span></button>
      </nav>
    </header>
    <div id="bar" class="bar">
      <span id="stats" class="muted" role="status"></span>
      <span class="spacer"></span>
      <label id="wrap-box" class="check" hidden><input id="wrap" type="checkbox" checked /> <span data-i18n>Wrap lines</span></label>
      <button id="more" class="btn" type="button" data-i18n hidden>Load more</button>
    </div>
    <main id="view" tabindex="-1"></main>
    <script type="module" src="viewer.js"></script>
  </body>
</html>
