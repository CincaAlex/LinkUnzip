# Publishes the website in site/ (home page and privacy policy) to GitHub Pages whenever it changes
# on main. One-time setting: Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Fill the {{...}} placeholders in site/ before the first deploy (docs/release.md).
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Refuse unfilled placeholders
        run: |
          if grep -rn '{{[A-Z_]*}}' site; then
            echo "::error::site/ still has {{...}} placeholders (see docs/release.md)"
            exit 1
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
