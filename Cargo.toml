[package]
name = "linkunzip"
version = "0.2.0"
edition = "2024"
description = "Extract a ZIP straight from a link into a folder, without ever saving the ZIP"
license = "GPL-3.0-or-later"
repository = "https://github.com/CincaAlex/LinkUnzip"
homepage = "https://linkunzip.app"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
crc32fast = "1.5.2"
flate2 = "1.1.10"
fs4 = "1.1.0"
glob = "0.3.4"
indicatif = "0.18.6"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
axum = "0.8.9"
futures-util = "0.3.34"
hex = "0.4.3"
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
